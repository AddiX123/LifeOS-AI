<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">LifeOS AI star growth chart</title>
<desc id="desc">Illustrative growth target chart for LifeOS AI, showing a target of 10,000 GitHub stars by August 29, 2026. This is not historical GitHub star data.</desc>
<rect width="1200" height="520" rx="24" fill="#0b1020"/>
<text x="70" y="68" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">⭐ LifeOS AI — Star Growth</text>
<text x="70" y="102" fill="#aab4cc" font-family="Arial, sans-serif" font-size="16">Illustrative milestone target • 10,000 stars by 29 August 2026</text>
<g stroke="#27314a" stroke-width="1">
<line x1="90" y1="400" x2="1130" y2="400"/><line x1="90" y1="320" x2="1130" y2="320"/><line x1="90" y1="240" x2="1130" y2="240"/><line x1="90" y1="160" x2="1130" y2="160"/>
</g>
<g fill="#8d98b2" font-family="Arial, sans-serif" font-size="14">
<text x="42" y="405">0</text><text x="22" y="325">2.5k</text><text x="22" y="245">5k</text><text x="22" y="165">7.5k</text><text x="22" y="85">10k</text>
<text x="90" y="438">20 Aug</text><text x="340" y="438">22 Aug</text><text x="600" y="438">24 Aug</text><text x="850" y="438">27 Aug</text><text x="1040" y="438">29 Aug</text>
</g>
<polyline fill="none" stroke="#7c8cff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="90,400 300,388 500,350 700,300 860,220 1000,130 1130,80"/>
<circle cx="1130" cy="80" r="10" fill="#ffffff" stroke="#7c8cff" stroke-width="5"/>
<rect x="850" y="34" width="250" height="54" rx="14" fill="#151d34" stroke="#33405f"/>
<text x="875" y="67" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">10,000 • 29 Aug 2026</text>
<text x="90" y="482" fill="#7f8ba6" font-family="Arial, sans-serif" font-size="13">Illustrative target only — replace with verified historical star data when available.</text>
